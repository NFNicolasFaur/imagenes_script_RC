<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Imagen</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        img {
            max-width: 100%;
            height: auto;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }
        img:hover {
            transform: scale(1.05); /* Efecto de ampliación al pasar el mouse */
        }
    </style>
</head>
<body>
    <!-- Enlace a otro lugar, en este caso se abre un sitio web cuando se hace clic en la imagen -->
    <a href="https://www.cargaRC.com" target="_blank">
        <img src="graficoex1RC.png" alt="Imagen alta resolución circuito RC">
    </a>
</body>
</html>
